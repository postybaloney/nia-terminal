name: NIA nightly ingest

# Replaces the always-on Railway scheduler with a free scheduled job.
# The pipeline is a daily batch, so a cron workflow is the right shape:
# no idle server, free minutes, built-in logs + retries.
# After ingest it builds a STATIC site (dashboard + knowledge graph +
# Intelligence Layer issue) and publishes it to GitHub Pages — so there's no
# live dashboard server to run.
#
# ONE-TIME MANUAL STEP: GitHub → repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Until that is set, the deploy job fails even though
# the build succeeds. Site then serves at:
#     https://postybaloney.github.io/nia-terminal/

on:
  schedule:
    - cron: "0 7 * * *"      # 07:00 UTC daily = 00:00 America/Los_Angeles
  workflow_dispatch: {}       # lets you run it manually from the Actions tab

# GitHub Pages deploy needs pages:write + id-token:write; checkout needs contents:read.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nia-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # --- set these in GitHub → repo Settings → Secrets and variables → Actions ---
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}       # Neon connection string (postgresql://...sslmode=require)
      LLM_BACKEND:       ${{ secrets.LLM_BACKEND }}        # e.g. groq
      # Optional override. LEAVE THE SECRET UNSET unless you have a reason:
      # empty means "let the backend pick its own current default", which is
      # what survives a provider retiring a model. Until 2026-08-19 this line
      # was missing entirely, so setting the LLM_MODEL secret had no effect at
      # all — the variable never reached the job.
      LLM_MODEL:         ${{ secrets.LLM_MODEL }}
      # Both optional. An unset secret arrives as "" and config.py's
      # _treat_empty_env_as_unset drops it class-wide, so the field default
      # applies — that guard is what makes it safe to list them here at all.
      # AFFECT_MODEL empty  = affect uses the same model as everything else.
      # Set it to give the affect pass its own budget (Groq limits are
      # per-model), e.g. openai/gpt-oss-20b.
      AFFECT_MODEL:          ${{ secrets.AFFECT_MODEL }}
      # Tokens/minute the affect pass paces itself against. 8000 = Groq free.
      LLM_TOKENS_PER_MINUTE: ${{ secrets.LLM_TOKENS_PER_MINUTE }}
      GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
      OPENFDA_API_KEY:   ${{ secrets.OPENFDA_API_KEY }}    # optional
      EPO_CLIENT_ID:     ${{ secrets.EPO_CLIENT_ID }}      # optional
      EPO_CLIENT_SECRET: ${{ secrets.EPO_CLIENT_SECRET }}  # optional
      RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}     # optional (digest email)
      RESEND_FROM:       ${{ secrets.RESEND_FROM }}        # optional
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}  # optional (digest to Slack)
      # SMTP path — the local .env has these but Actions never did, which is
      # why every scheduled digest logged "no email channel configured" and
      # dispatched nowhere. Set them as repo secrets to turn delivery on.
      SMTP_HOST:         ${{ secrets.SMTP_HOST }}
      SMTP_PORT:         ${{ secrets.SMTP_PORT }}
      SMTP_USER:         ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
      DIGEST_EMAIL_TO:   ${{ secrets.DIGEST_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure schema (idempotent)
        run: python main.py init

      - name: Run full pipeline (patents + theses + signals)
        run: python main.py run-all

      - name: Generate + send current-signal digest
        # Drop "--send" (and the notify secrets) if you only want it in the log for now.
        run: python main.py digest-signals --send

      - name: Weekly patent digest (Mondays only)
        if: ${{ github.event.schedule == '0 7 * * *' }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then python main.py digest --send; fi

      # ── Static site ──────────────────────────────────────────────────────
      # Built with if:always() so a flaky-API night still publishes a fresh
      # site from whatever data made it into the DB.
      #
      # build_site.py produces three linked pages — dashboard, knowledge graph,
      # and the current Intelligence Layer issue — and degrades gracefully: a
      # generator that fails leaves a placeholder page saying so, rather than a
      # broken link or, worse, stale data presented as current.
      # Affect must run BEFORE the site build: build_site.py rebuilds the graph,
      # and graph_build reads each signal's stored affect to carry valence onto
      # its node. Run it afterwards and the deployed graph has no sentiment in
      # it at all. Capped per night so LLM cost stays bounded; the pass is
      # resumable, so any backlog drains over successive runs.
      - name: Extract entity affect (bounded, resumable)
        if: always()
        continue-on-error: true
        run: python main.py affect --limit 100

      - name: Build static site (dashboard + graph + issue)
        if: always()
        run: python build_site.py --out site --days 30

      - name: Show what was published
        if: always()
        run: ls -la site/

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: ingest
    if: always()            # publish the snapshot even on a partial-ingest night
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ─────────────────────────────────────────────────────────────────────────────
# LATER — move to Cloudflare Pages once you have a custom domain:
#   1. Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#   2. Delete the `deploy` job above and the `pages`/`id-token` permission lines.
#   3. Replace the "Upload Pages artifact" step with:
#
#        - name: Deploy to Cloudflare Pages
#          if: always()
#          uses: cloudflare/wrangler-action@v3
#          with:
#            apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#            accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#            command: pages deploy site --project-name=nia-terminal
#
#   Then point terminal.neurotechintelligenceagency.com at the Pages project.
# ─────────────────────────────────────────────────────────────────────────────